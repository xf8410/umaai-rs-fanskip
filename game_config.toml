# 用户覆盖配置（Phase 2 步骤 2+3 改造）
# 这里只写你要改的项；未列出则使用 default_config.toml 的开发默认。
# [config_override] 段字段均为可选覆盖（None = 不覆盖 default）；未知字段会解析报错（防拼错）。
# 完整段说明见 default_config.toml 顶部"配置段"块：simulation / search / policy / output / dev

# ---------- 拉面杯第3年地区选择策略（**顶层覆盖**；fixed 仅第3年生效）----------
# 注意：顶层字段必须写在所有 [xxx] 段**之前**（本文件顶部），写在 [mcts] 段后会
# 被 [mcts] 的未知字段检查吸收，解除注释也不生效。要启用请把下面两行移到文件顶
# 部（第 5 行注释之后）再取消注释：
ramen_region_strategy = "all"   # "all"（默认）/"fixed"（仅第3年，跳过 120 组合枚举）
# ramen_region_fixed = [[10, 12, 14]]   # 仅当 fixed 时生效，长度必须 = 1

# ---------- 粉丝跳过（fanskip 版新增；顶层覆盖，须写在所有 [xxx] 段之前）----------
# true = 真机 AI 不再按"区间内已赛场次"强制自选比赛。适用于种马继承粉丝基数高、
# 进入粉丝数回合区间前粉丝已达标的情况（此时游戏不会因少打比赛而失败）。
# ⚠️ 开启后由你自行保证粉丝达标（看小黑板粉丝数），否则自选比赛未达标会翻车。
# 默认 false（关闭，行为与上游一致）。模拟器/bench 判定不受本开关影响。
ramen_skip_free_race = false

# ---------- 常用区：[config_override] 段 ----------
[config_override]
uma = 101901
cards = [302754, 303124, 302984, 303044, 303064, 303054]
blue_count = [15, 0, 0, 0, 3]
# 种马额外属性 [速度, 耐力, 力量, 根性, 智力, 技能点]
extra_count = [0, 10, 20, 40, 40, 40]
log_level = "info"

# 线程数（建议 = CPU 核心数；特定处理器如 Intel 14900k 若崩溃/蓝屏可改为 8）
num_threads = 16

# 训练员类型（可选覆盖 default_config.toml 的 trainer）
# "manual" | "random" | "handwritten" | "collector" | "neuralnet" | "mcts"
trainer = "mcts"

# 温泉选择是否允许蒙特卡洛自由发挥（安卓马建议 false 减少世界线；须写在本段内才生效）
mcts_selected_onsen = true

# ---------- 常用区：[mcts] 段（覆盖默认搜索参数）----------
[mcts]
search_n = 8192
radical_factor_max = 1.4

# ============================================================
# 温泉遗留段（Phase 6 删除温泉时代预期移除）
# ============================================================

# 温泉选择优先顺序
[onsen_order]
year1 = [1, 3, 2]
year2 = [7, 5, 4, 2]
year3 = [8, 9, 4, 2, 6]
